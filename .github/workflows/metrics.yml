name: Generate metrics (3D calendar)

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN: must be a CLASSIC PAT (lowlighter/metrics uses the GraphQL API, which does
          # NOT support fine-grained tokens). Scopes: read:user (+ repo for private contributions).
          # Create at https://github.com/settings/tokens/new — add as repo secret METRICS_TOKEN.
          token: ${{ secrets.METRICS_TOKEN }}
          user: jainilDesai
          filename: github-metrics.svg
          template: classic
          base: ""                       # no header/activity/etc — image only
          config_timezone: Asia/Kolkata
          # 3D isometric contribution calendar (the only thing rendered)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
