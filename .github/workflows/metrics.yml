name: Generate metrics (3D calendar)

on:
  schedule:
    - cron: "0 0 * * *"   # daily at 00:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate github-metrics.svg
        uses: lowlighter/metrics@latest
        with:
          # METRICS_TOKEN: prefer a FINE-GRAINED PAT (read-only: Contents, Metadata) over a classic
          # `repo`-scope token. Add as repo secret METRICS_TOKEN. Create at
          # https://github.com/settings/tokens?type=beta
          token: ${{ secrets.METRICS_TOKEN }}
          user: jainilDesai
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
          # 3D isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # language breakdown
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          # coding habits
          plugin_habits: yes
          plugin_habits_charts: yes
